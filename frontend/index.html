<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAT Test Manager — Home</title>

  <!-- Tailwind CDN (official recommended script) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="icon" href="logo.png" type="image/x-icon">
</head>
<body class="h-full flex flex-col">

  <div class="flex-1 min-h-screen p-6">
    <div class="max-w-5xl mx-auto">

      <!-- Header -->
      <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4">
        <h1 class="text-3xl font-bold">SAT Test Manager</h1>
        <div class="flex gap-3">
          <a href="/test.html" class="px-4 py-2 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 transition">Add Test</a>
          <a href="/correct.html" class="px-4 py-2 bg-orange-600 text-white rounded-lg shadow hover:bg-orange-700 transition">Correct Test</a>
        </div>
      </header>

      <!-- Main content -->
      <main>
        <section class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
          <h2 class="text-xl font-semibold mb-4">Saved Tests</h2>

          <div class="overflow-x-auto">
            <table id="testsTable" class="w-full table-auto border-collapse text-left">
              <thead class="bg-gray-100 dark:bg-gray-700">
                <tr>
                  <th class="p-3 border-b">Test Name</th>
                  <th class="p-3 border-b">Score</th>
                  <th class="p-3 border-b">Date</th>
                  <th class="p-3 border-b">Actions</th>
                </tr>
              </thead>
              <tbody>
                <!-- Rows populated dynamically -->
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Details Modal -->
  <div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-gray-800 w-full max-w-6xl rounded-xl shadow-lg p-6 relative">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-lg font-semibold">Test Details</h3>
        <div class="flex gap-2">
          <button id="saveDetails" class="px-3 py-1 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">Save Changes</button>
          <button id="viewAnswersOnly" class="px-3 py-1 border rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition">View Answers Only</button>
          <button id="backToEditable" class="px-3 py-1 border rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition hidden">Back to editable</button>
          <button id="closeModal" class="px-3 py-1 border rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition">Close</button>
        </div>
      </div>
      <div id="modalBody" class="space-y-2 overflow-auto max-h-[90vh]">
        <!-- Test answers dynamically inserted here -->
      </div>
    </div>
  </div>

  <!-- Correction Modal -->
  <div id="correctModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-gray-800 w-full max-w-2xl rounded-xl shadow-lg p-6 relative">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold">Correct Test</h3>
        <button id="closeCorrectModal" class="px-3 py-1 border rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition">Close</button>
      </div>
      <form id="correctTestForm" class="space-y-4">
        <div>
          <label for="correctModalImage" class="block text-sm font-medium mb-2">Upload Answer Key Image</label>
          <input id="correctModalImage" type="file" accept="image/*" required class="w-full px-4 py-2 border rounded-lg bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Upload a clear image of the answer key, or paste an image from your clipboard (Ctrl+V / Cmd+V)</p>
        </div>

        <!-- Image Preview -->
        <div id="correctImagePreviewContainer" class="hidden">
          <img id="correctImagePreview" src="" alt="Answer key preview" class="max-w-full h-auto max-h-60 rounded-lg border">
        </div>

        <!-- Status -->
        <div id="correctStatusContainer" class="hidden p-3 rounded-lg border text-sm">
          <span id="correctStatusText"></span>
        </div>

        <!-- Buttons -->
        <div class="flex gap-3 justify-end">
          <button type="submit" id="correctFormSubmitBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">Correct Test</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="index.js"></script>
  <!-- `test.js` is only loaded by `test.html` to avoid errors on the home page -->
</body>
</html>
